name: test

on:
  push:
  pull_request:

jobs:
  stub:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 端到端
        run: node test/stub.mjs
      - name: 跨对话记忆
        run: node test/recall.mjs
